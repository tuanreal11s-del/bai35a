<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài tập 35a - Form đăng ký</title>
  <style>
    :root {
      --bg: #f5f7fb; --card: #ffffff; --text: #1f2937; --muted: #6b7280;
      --primary: #2563eb; --border: #d1d5db; --danger: #b91c1c;
      --ok-bg: #dcfce7; --ok: #166534;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827; --card: #1f2937; --text: #f3f4f6; --muted: #9ca3af;
        --primary: #60a5fa; --border: #4b5563; --danger: #fca5a5;
        --ok-bg: #14532d; --ok: #bbf7d0;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 16px; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--card);
      border-radius: 12px; padding: 28px; box-shadow: 0 4px 20px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 20px; font-size: 1.5rem; text-align: center; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: .95rem; }
    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; padding: 11px 12px; font-size: 1rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    input:focus { outline: 2px solid var(--primary); }
    input[aria-invalid="true"] { border-color: var(--danger); }
    .error { color: var(--danger); font-size: .85rem; min-height: 1.1em; margin-top: 4px; }
    .hint { color: var(--muted); font-size: .8rem; margin-top: 4px; }
    .check { display: flex; align-items: center; gap: 8px; }
    .check label { margin: 0; font-weight: 400; }
    button {
      width: 100%; padding: 12px; margin-top: 8px; border: 0; border-radius: 8px;
      background: var(--primary); color: #fff; font-size: 1rem; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .success {
      background: var(--ok-bg); color: var(--ok); padding: 12px;
      border-radius: 8px; margin-bottom: 16px; text-align: center;
    }
    @media (max-width: 480px) { .card { padding: 20px; } }
  </style>
</head>
<body>
  <main class="card">
    <h1>Đăng ký tài khoản</h1>
    <div id="status" role="status" aria-live="polite"></div>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="name">Tên</label>
        <input type="text" id="name" maxlength="50" autocomplete="name">
        <div class="error" id="nameErr"></div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" maxlength="100" autocomplete="email">
        <div class="error" id="emailErr"></div>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" maxlength="64" autocomplete="new-password">
        <div class="hint">Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và số.</div>
        <div class="error" id="passwordErr"></div>
      </div>

      <div class="field">
        <div class="check">
          <input type="checkbox" id="terms">
          <label for="terms">Tôi đồng ý với điều khoản sử dụng</label>
        </div>
        <div class="error" id="termsErr"></div>
      </div>

      <button type="submit" id="submitBtn">Đăng ký</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("regForm");
    const statusEl = document.getElementById("status");
    const btn = document.getElementById("submitBtn");
    const STORAGE_KEY = "users";

    const fields = {
      name: document.getElementById("name"),
      email: document.getElementById("email"),
      password: document.getElementById("password"),
      terms: document.getElementById("terms")
    };

    // ---------- Validate ----------
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function validate(v) {
      const errors = {};
      if (v.name.length < 2) errors.name = "Tên phải có ít nhất 2 ký tự.";
      if (!EMAIL_RE.test(v.email)) errors.email = "Email không hợp lệ.";
      if (v.password.length < 8) errors.password = "Mật khẩu phải có ít nhất 8 ký tự.";
      else if (!/[A-Z]/.test(v.password)) errors.password = "Mật khẩu cần ít nhất 1 chữ hoa.";
      else if (!/[a-z]/.test(v.password)) errors.password = "Mật khẩu cần ít nhất 1 chữ thường.";
      else if (!/[0-9]/.test(v.password)) errors.password = "Mật khẩu cần ít nhất 1 chữ số.";
      if (!v.terms) errors.terms = "Bạn cần đồng ý điều khoản.";
      return errors;
    }

    function showErrors(errors) {
      ["name", "email", "password", "terms"].forEach(k => {
        document.getElementById(k + "Err").textContent = errors[k] || "";
        if (k !== "terms") fields[k].setAttribute("aria-invalid", errors[k] ? "true" : "false");
      });
    }

    function showStatus(text, ok) {
      statusEl.replaceChildren();
      if (!text) return;
      const d = document.createElement("div");
      d.className = ok ? "success" : "error";
      d.textContent = text; // textContent: chống XSS
      statusEl.appendChild(d);
    }

    // ---------- Bảo mật cục bộ: băm mật khẩu (PBKDF2 + salt), KHÔNG lưu plaintext ----------
    const toHex = (buf) => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");

    async function hashPassword(password) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const keyMaterial = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, 256);
      return { salt: toHex(salt), hash: toHex(bits) };
    }

    function loadUsers() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(data) ? data : [];
      } catch { return []; } // dữ liệu hỏng hoặc bị chỉnh sửa => coi như rỗng
    }

    // ---------- Xử lý submit ----------
    form.addEventListener("submit", async (e) => {
      e.preventDefault(); // chặn tải lại trang
      showStatus("");

      const values = {
        name: fields.name.value.trim(),
        email: fields.email.value.trim().toLowerCase(),
        password: fields.password.value, // không trim mật khẩu
        terms: fields.terms.checked
      };

      const errors = validate(values);
      showErrors(errors);
      if (Object.keys(errors).length) {
        const first = Object.keys(errors)[0];
        fields[first].focus();
        return;
      }

      btn.disabled = true; // chống bấm nhiều lần
      try {
        const users = loadUsers();
        if (users.some(u => u.email === values.email)) {
          showErrors({ email: "Email này đã được đăng ký." });
          return;
        }
        const { salt, hash } = await hashPassword(values.password);
        users.push({
          name: values.name, email: values.email, salt, hash,
          createdAt: new Date().toISOString()
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(users));

        form.reset();
        showErrors({});
        showStatus(`Đăng ký thành công! Chào mừng ${values.name}.`, true);
      } catch (err) {
        showStatus("Không thể lưu dữ liệu (trình duyệt có thể đang chặn LocalStorage).", false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
